sonar.projectKey=Chamisew_Cloud-Microservices-Assignment-2026
sonar.organization=chamisew
sonar.projectName=Cloud Microservices Assignment 2026
sonar.projectVersion=1.0

# Source configuration
sonar.sources=api-gateway/,user-service/,queue-service/,token-service/,notification-service/
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.md,**/static/**,**/frontend/**,**/*.html,**/*.css,**/*.js,**/*.json,**/*.yaml,**/*.yml,**/*.pyc

# Python configuration
sonar.language=py
sonar.python.version=3.9

# Quality gate settings - be more lenient for student project
sonar.python.coverage.reportPaths=coverage.xml

# Duplication settings - increase threshold to reduce false positives
sonar.cpd.python.minimumTokens=200
sonar.cpd.python.minimumLines=20

