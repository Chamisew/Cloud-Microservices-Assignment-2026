sonar.projectKey=Chamisew_Cloud-Microservices-Assignment-2026
sonar.organization=chamisew
sonar.projectName=Cloud Microservices Assignment 2026
sonar.projectVersion=1.0

# Source configuration - only analyze Python backend code
sonar.sources=api-gateway/,user-service/,queue-service/,token-service/,notification-service/
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.md,**/static/**,**/frontend/**,**/*.html,**/*.css,**/*.js,**/*.json,**/*.yaml,**/*.yml,**/*.pyc,**/requirements.txt,**/.env,**/Dockerfile

# Python configuration
sonar.language=py
sonar.python.version=3.9

# Test configuration
sonar.tests=**/tests/
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPaths=test-results.xml

# Duplication settings - reasonable for student microservices project
sonar.cpd.python.minimumTokens=300
sonar.cpd.python.minimumLines=30

# Exclude test files from duplication detection (they often have similar patterns)
sonar.cpd.exclusions=**/tests/**,**/test_*.py


