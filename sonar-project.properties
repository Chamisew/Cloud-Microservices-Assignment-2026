sonar.projectKey=Chamisew_Cloud-Microservices-Assignment-2026
sonar.organization=chamisew
sonar.projectName=Cloud Microservices Assignment 2026
sonar.projectVersion=1.0

# Python backend only. Use comma-separated dirs only (no * or ** on sonar.sources / sonar.tests).
# No trailing slashes (avoids odd parser behaviour on some scanner versions).
sonar.sources=api-gateway,user-service,queue-service,token-service,notification-service

# Exclude tests from production metrics (wildcard patterns are OK here, not in sonar.sources).
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*.md,**/static/**,**/frontend/**,**/*.html,**/*.css,**/*.js,**/*.json,**/*.yaml,**/*.yml,**/*.pyc,**/requirements.txt,**/.env,**/Dockerfile

# Do not set sonar.tests to paths under sonar.sources (overlap/nesting breaks Scanner 7.x).
# Test folders are excluded above; for dedicated test analysis later, use Sonar docs:
# separate roots or sonar.tests + sonar.test.inclusions patterns.

sonar.language=py
sonar.python.version=3.9

# Optional reports (uncomment when CI uploads these files):
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.python.xunit.reportPaths=test-results.xml

sonar.cpd.python.minimumTokens=300
sonar.cpd.python.minimumLines=30
sonar.cpd.exclusions=**/tests/**,**/test_*.py
