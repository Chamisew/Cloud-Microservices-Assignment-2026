name: User Service CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Security Scanning Job
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd user-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety

      - name: Run Bandit Security Scan
        run: |
          cd user-service
          bandit -r . -f json -o bandit-report.json || true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: user-service/bandit-report.json
          if-no-files-found: ignore

      - name: Run Safety Dependency Check
        run: |
          cd user-service
          safety check --full-report || true

  # Code Quality Job
  code-quality:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd user-service
          pip install flake8 pylint

      - name: Run Flake8 Linting
        run: |
          cd user-service
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run PyLint Analysis
        run: |
          cd user-service
          pylint *.py --disable=R,C,W1203,W0718,W0719 || true

  # Docker Build and Test Job
  docker-build:
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          cd user-service
          docker build -t user-service:latest .

      - name: Test Docker container
        run: |
          cd user-service
          # Run container in background
          docker run -d --name user-service-test -p 5001:5001 user-service:latest
          # Wait for container to start
          sleep 10
          # Test health endpoint
          curl -f http://localhost:5001/health || exit 1
          # Clean up
          docker stop user-service-test
          docker rm user-service-test

  # Docker Push Job (only on main branch)
  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          cd user-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

  # Integration Test Job
  integration-test:
    runs-on: ubuntu-latest
    needs: docker-build
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          cd user-service
          pip install -r requirements.txt
          pip install pytest pytest-cov requests

      - name: Run integration tests
        run: |
          cd user-service
          # Set environment variables for testing
          export MONGO_URI="mongodb://localhost:27017/test_db"
          export FLASK_ENV=test
          # Run tests (create test file separately)
          python -m pytest tests/ -v --cov=app --cov-report=xml || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./user-service/coverage.xml
          flags: unittests
          name: user-service-coverage
        if: always()

  # Deployment Job (example for different environments)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-push, integration-test]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment logic here
          # Example: kubectl apply -f k8s/staging/
          
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-push, integration-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment logic here
          # Example: kubectl apply -f k8s/production/