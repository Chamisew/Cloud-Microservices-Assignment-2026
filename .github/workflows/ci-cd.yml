name: Build and Push to Azure

# Triggers:
# - push to main → build changed services and push to ACR.
# - pull_request targeting main → same (same-repo PRs only for ACR; fork PRs skip).
# - workflow_dispatch → rebuild all matrix services.
# Repo uses main only (no develop branch).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    # Forked PRs cannot use your ACR secrets; skip the job to avoid failing checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - queue-service
          - token-service
          - notification-service
          - frontend
          - api-gateway
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up service context
        id: setcontext
        run: |
          echo "SERVICE_PATH=${{ matrix.service }}" >> $GITHUB_ENV

      - name: Login to Azure Container Registry
        run: echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      - name: Check if service changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - '${{ matrix.service }}/**'

      - name: Build ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Push ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/${{ matrix.service }}:latest
