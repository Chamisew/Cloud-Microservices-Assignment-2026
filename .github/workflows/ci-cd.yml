name: Build and Push to Azure

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        run: echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      - name: Build User Service Image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/user-service:latest ./user-service

      - name: Push User Service Image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/user-service:latest
      
      #add queu-service
      - name: Build Queue Service Image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/queue-service:latest ./queue-service  

      - name: Push Queue Service Image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/queue-service:latest  
      
      #add token-service
      - name: Build Token Service Image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/token-service:latest ./token-service

      - name: Push Token Service Image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/token-service:latest

      # Add notification-service
      - name: Build Notification Service Image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/notification-service:latest ./notification-service

      - name: Push Notification Service Image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/notification-service:latest

        # Add frontend
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest ./frontend

      - name: Push Frontend Image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/frontend:latest
