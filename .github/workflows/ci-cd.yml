name: Build and Push to Azure

# Why the live site may not update after a successful push:
# Pushing a new image to ACR with tag ":latest" does NOT automatically restart Azure App Service /
# Container Instances. The platform often caches the previous digest until you restart the app or
# enable ACR continuous deployment. Optionally set repo Variables + AZURE_CREDENTIALS secret below
# so this workflow restarts the frontend Web App after push.

# Triggers:
# - push to main → build changed services and push to ACR.
# - pull_request targeting main → same (same-repo PRs only for ACR; fork PRs skip).
# - workflow_dispatch → rebuild all matrix services.
# Repo uses main only (no develop branch).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    # Forked PRs cannot use your ACR secrets; skip the job to avoid failing checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - queue-service
          - token-service
          - notification-service
          - frontend
          - api-gateway
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up service context
        id: setcontext
        run: |
          echo "SERVICE_PATH=${{ matrix.service }}" >> $GITHUB_ENV

      - name: Login to Azure Container Registry
        run: echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      - name: Check if service changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - '${{ matrix.service }}/**'

      - name: Build ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: |
          REG="${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}"
          IMG="$REG/${{ matrix.service }}"
          docker build -t "$IMG:latest" -t "$IMG:${{ github.sha }}" ./${{ matrix.service }}

      - name: Push ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: |
          REG="${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}"
          IMG="$REG/${{ matrix.service }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"

  # Optional: restart Linux Web App for Containers so it pulls the new :latest digest.
  # GitHub repo → Settings → Secrets and variables → Actions:
  #   Secret:  AZURE_CREDENTIALS (service principal JSON from `az ad sp create-for-rbac`)
  #   Variables: AZURE_FRONTEND_WEBAPP_NAME, AZURE_RESOURCE_GROUP
  # Omit variables to skip this job (you must restart the app manually or use Deployment Center CD).
  restart-azure-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_FRONTEND_WEBAPP_NAME != '' &&
      vars.AZURE_RESOURCE_GROUP != ''
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart frontend Web App
        run: |
          az webapp restart \
            --name "${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
