name: Build and Push to Azure

# Pushes to ACR only when files under each service folder change (see paths-filter), unless you run
# "workflow_dispatch" which rebuilds every matrix service (useful after changing only workflows or .env).
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - user-service
          - queue-service
          - token-service
          - notification-service
          - frontend
          - api-gateway
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up service context
        id: setcontext
        run: |
          echo "SERVICE_PATH=${{ matrix.service }}" >> $GITHUB_ENV

      - name: Login to Azure Container Registry
        run: echo ${{ secrets.AZURE_REGISTRY_PASSWORD }} | docker login ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }} -u ${{ secrets.AZURE_REGISTRY_USERNAME }} --password-stdin

      - name: Check if service changed
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service:
              - '${{ matrix.service }}/**'

      - name: Build ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Push ${{ matrix.service }} Image
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.service == 'true'
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/${{ matrix.service }}:latest
